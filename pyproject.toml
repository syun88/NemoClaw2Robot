[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nemoclaw2robot"
version = "0.1.0"
description = "NemoClaw skill and MuJoCo prompt bridge for ALOHA robot simulation tasks."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
sim = [
  "mujoco>=3.2.0",
]
dev = [
  "pytest>=8.0",
]

[project.scripts]
nemoclaw2robot = "nemoclaw2robot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

